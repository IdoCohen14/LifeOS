<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151719"><title>LifeOS — ללא חיבור</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151719;color:#f1f2f4;font:16px/1.8 "Segoe UI",Arial,sans-serif;text-align:center}main{max-width:30em;padding:30px}p{color:#b0b5bd}a{display:inline-block;padding:10px 22px;border-radius:8px;background:#7da4ff;color:#152039;text-decoration:none}</style><main><h1>המרחב שלך מחכה לך.</h1><p>אין כרגע חיבור לשרת המקומי. ודאו ש־LifeOS פועל במחשב, ואז נסו שוב. המידע השמור נשאר במחשב; עריכה ללא חיבור עדיין אינה נתמכת.</p><a href="/">ניסיון נוסף</a></main></html>
